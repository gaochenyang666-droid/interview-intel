name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate example evidence
        run: python scripts/interview_intel.py validate examples/research-us-software-engineer.json

      - name: Validate example report rendering
        run: |
          python scripts/interview_intel.py render \
            examples/research-us-software-engineer.json \
            --output rendered-example.md
          test -s rendered-example.md

      - name: Build example research plan
        run: |
          python scripts/interview_intel.py plan \
            examples/input-jp-product-manager.json \
            --format json \
            --network-status unavailable \
            --output rendered-plan.json
          test -s rendered-plan.json
