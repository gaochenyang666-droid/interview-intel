interface:
  display_name: "Interview Intel"
  short_description: "Global source-graded interview research and mock practice"
  default_prompt: "Use three inputs: country, company, and role. Treat 0 as unknown and skip it. Search in English first, then the main local language. Verify official information and public workplace communities. Prefer same-company and same-role interview accounts, then label lower-tier and predicted questions explicitly. Deliver a six-section Chinese report with cited sources, no interviewer profiling, and no numeric company score by default. Support a one-question-at-a-time mock interview."
